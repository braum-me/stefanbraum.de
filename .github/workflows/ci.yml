name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Lint, typecheck, test, build, smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Biome
        run: pnpm exec biome ci .

      - name: Typecheck (astro check + tsc)
        run: pnpm check

      - name: Unit tests
        run: pnpm test

      - name: Production build
        run: pnpm exec astro build

      - name: Smoke tests (routes, links, canonical/hreflang, anchors, 404)
        run: pnpm test:smoke

      - name: Install Chromium for browser tests
        run: pnpm exec playwright install --with-deps chromium

      - name: Browser tests (layout, deep links, a11y, no-JS)
        run: pnpm test:e2e
